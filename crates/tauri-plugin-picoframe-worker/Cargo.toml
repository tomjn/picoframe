[package]
name = "tauri-plugin-picoframe-worker"
version = "0.5.0"
description = "Example long-lived sidecar plugin for picoframe (Rust half). ACL identifier: picoframe-worker"
edition.workspace = true
license.workspace = true
repository.workspace = true
# Tauri requires `links` to equal `package.name`. The ACL identifier is this
# name with the `tauri-plugin-` prefix stripped -> `picoframe-worker`.
links = "tauri-plugin-picoframe-worker"

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dependencies]
tauri = { workspace = true }
serde_json = { workspace = true }
picoframe-core = { workspace = true }
